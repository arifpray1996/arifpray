<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abang Perhiasan: Arif Pray Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; overflow: hidden; }
        
        .bg-wood {
            background:
                linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
                url('aset/bg1.jpg');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .typing-cursor::after {
            content: "|";
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-bounce-slow { animation: bounce-slow 3s infinite ease-in-out; }

        /* Comic Bubble Style */
        .comic-bubble {
            background: white;
            color: #1c1917;
            border-radius: 2rem;
            padding: 1.5rem 2rem;
            position: relative;
            box-shadow: 0 10px 0 rgba(0,0,0,0.25);
            border: 4px solid #1c1917;
        }
        .comic-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 20px solid #1c1917;
        }

        /* Transition Animations */
        .fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        .fade-out-up { animation: fadeOutUp 0.5s ease-in forwards; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOutUp {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        /* Phone Vibrating Animation */
        @keyframes phone-vibrate {
            0% { transform: rotate(0) scale(1); }
            10% { transform: rotate(-15deg) scale(1.1); }
            20% { transform: rotate(15deg) scale(1.1); }
            30% { transform: rotate(-15deg) scale(1.1); }
            40% { transform: rotate(15deg) scale(1.1); }
            50% { transform: rotate(0) scale(1); }
            100% { transform: rotate(0) scale(1); }
        }
        .animate-phone {
            animation: phone-vibrate 0.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-stone-950 min-h-screen select-none text-white">

    <!-- Intro Storytelling Layer -->
    <div id="intro-layer" class="fixed inset-0 z-[100] flex flex-col items-center justify-center transition-all duration-1000 bg-wood">
        
        <div class="absolute inset-0 bg-radial-gradient from-amber-500/10 via-transparent to-black/80 pointer-events-none"></div>

        <!-- Central Character (Customer) - Initially Hidden -->
        <div id="customer-container" class="hidden opacity-0 relative z-20 flex flex-col items-center justify-center flex-grow w-full max-w-4xl transition-all duration-1000">
            
            <!-- Comic Bubble (Above Head) -->
            <div id="chat-box-area" class="h-48 w-full flex justify-center items-center px-4 mb-4">
                <div id="active-bubble" class="hidden comic-bubble max-w-lg w-full text-center">
                    <p id="speaker-name" class="text-[10px] font-black text-amber-600 uppercase tracking-[0.4em] mb-1"></p>
                    <div id="typing-content" class="text-xl md:text-2xl font-bold leading-tight"></div>
                </div>
            </div>

            <!-- Customer Image -->
            <div id="customer-img-wrapper" class="opacity-0 transition-all duration-1000 transform translate-y-10">
                <img src="Aset/customer1.png" alt="Customer" class="w-[300px] md:w-[450px] drop-shadow-[0_20px_50px_rgba(0,0,0,0.7)] animate-bounce-slow" ;">
            </div>
        </div>

        <!-- Title & Start Button (Final Step, appears after avatar disappears) -->
        <div id="final-intro-ui" class="hidden absolute inset-0 flex flex-col items-center justify-center z-30">
            <!-- Title Header -->
            <div id="game-title" class="text-center mb-16 opacity-0 transition-all duration-1000">
    
    <!-- Background Workshop Card -->
    <div class="absolute inset-0 
            bg-[radial-gradient(circle_at_top,rgba(251,191,36,0.18),transparent_60%)]">
    </div>
    <div class="relative px-10 py-8 rounded-[3rem] overflow-hidden
                border border-amber-400/30
                shadow-[0_20px_80px_rgba(0,0,0,0.7)]
                bg-gradient-to-br from-stone-900/90 via-stone-800/90 to-black/90
                backdrop-blur-xl">

        <!-- Lamp Glow -->
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(251,191,36,0.25),transparent_70%)]"></div>

        <!-- Decorative Top Light -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2
                    w-60 h-16 bg-amber-300/20 blur-3xl">
        </div>

        <!-- Small Text -->
        <p class="text-amber-300 uppercase tracking-[0.6em] text-5xl md:text-base font-black mb-3">
            Workshop
        </p>

        <!-- Main Title -->
        <h1 class="relative text-5xl md:text-8xl font-black uppercase leading-none">
            <span class="block
            text-6xl md:text-9xl
            font-black uppercase
            text-transparent bg-clip-text
            bg-gradient-to-b
            from-[#f8e7c9]
            via-[#c08a52]
            to-[#6b3f1d]
            tracking-tight wood-title">
            Abang Perhiasan
            </span>
          
        </h1>

           
</span>

    </div>
</div>

            <div id="start-area" class="flex flex-col items-center opacity-0 transition-all duration-1000 translate-y-10">
                <p class="text-amber-400 font-bold text-xl mb-8 drop-shadow-md animate-pulse">"Waktunya beraksi di bengkel perhiasan!"</p>
                <!-- Redirects directly to the main gameplay file -->
                <button onclick="startGameplay()" class="bg-gradient-to-b from-amber-400 to-orange-600 text-stone-950 px-20 py-8 rounded-[3rem] font-black text-4xl shadow-[0_20px_50px_rgba(234,179,8,0.5)] hover:scale-105 active:scale-95 transition-all border-b-8 border-orange-800 uppercase ">
                    Mulai Merakit
                </button>
            </div>
        </div>

        <!-- Phone Ringing UI (FIRST to appear on Load) -->
        <div id="phone-ui" class="z-40 text-center flex flex-col items-center justify-center transition-all duration-500">
            <div class="text-9xl mb-8 animate-phone drop-shadow-[0_0_50px_rgba(251,191,36,0.8)] filter hover:scale-110 transition cursor-pointer">📞</div>
            <p class="text-amber-400 text-2xl font-black uppercase tracking-[0.5em] animate-pulse drop-shadow-md mb-8">Panggilan Masuk...</p>
            
            <!-- Answer Button -->
            <button onclick="answerPhone()" class="bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-black text-2xl px-12 py-6 rounded-[2rem] shadow-[0_15px_30px_rgba(16,185,129,0.4)] active:scale-95 transition-all border-b-4 border-green-800 flex items-center gap-4">
                <span>Angkat Telepon</span>
            </button>
        </div>
    </div>


        <!-- Background Music -->
        <audio id="bg-music" loop>
            <source src="Aset/backsound.mp3" type="audio/mpeg">
        </audio>
    <script>
        const dialogues = [
            { role: 'PELANGGAN', text: 'Halo bang, saya ingin memesan perhiasan untuk acara spesial.' },
            { role: 'ABANG PERHIASAN', text: 'Tentu bisa! Mau warna perhiasannya seperti apa?' },
            { role: 'PELANGGAN', text: 'Saya ingin kombinasi perak, emas, rubby dan safir yang elegan.' },
            { role: 'ABANG PERHIASAN', text: 'Baik! Mari kita mulai merakit sesuai pesanan Anda.' }
        ];

        let state = {
            dialogueIdx: 0
        };

        // INITIAL STATE: Only Phone UI is displayed
        window.onload = () => {
            const phone = document.getElementById('phone-ui');
            phone.classList.remove('hidden');
        };

        // When player clicks "Angkat Telepon"
        function answerPhone() {

        const phone = document.getElementById('phone-ui');
        const custContainer = document.getElementById('customer-container');
        const custImg = document.getElementById('customer-img-wrapper');

        // AUDIO
        const music = document.getElementById('bg-music');
        

      
        // 1. Hide phone UI
        phone.classList.add('opacity-0', 'scale-90');

        setTimeout(() => {

            phone.classList.add('hidden');

            // 2. Show Customer container
            custContainer.classList.remove('hidden');

            setTimeout(() => {

                custContainer.classList.add('opacity-100');

                // Customer image muncul
                custImg.classList.add('opacity-100', 'translate-y-0');

                // 3. PLAY background music lembut
                music.volume = 0.05;
                music.play();

                // Fade in music
                let vol = 0;

                const fadeMusic = setInterval(() => {

                    if (vol < 0.15) {

                        vol += 0.001;
                        music.volume = vol;

                    } else {

                        clearInterval(fadeMusic);

                    }

                }, 200);

                // 4. Start storytelling
                setTimeout(startStory, 800);

            }, 50);

        }, 400);
    }

        async function startStory() {
            if (state.dialogueIdx >= dialogues.length) {
                // HIDE Customer & Story UI
                const custContainer = document.getElementById('customer-container');
                custContainer.classList.add('opacity-0', '-translate-y-20');
                
                setTimeout(() => {
                    custContainer.classList.add('hidden');
                    // SHOW Final Title & Start Button
                    showFinalIntro();
                }, 1000);
                return;
            }

            const bubble = document.getElementById('active-bubble');
            const speaker = document.getElementById('speaker-name');
            const content = document.getElementById('typing-content');
            const data = dialogues[state.dialogueIdx];

            bubble.classList.remove('hidden', 'fade-out-up');
            bubble.classList.add('fade-in-up');
            speaker.innerText = data.role;
            
            content.innerHTML = "";
            content.classList.add('typing-cursor');
            for (let char of data.text) {
                content.innerHTML += char;
                await new Promise(r => setTimeout(r, 40));
            }
            content.classList.remove('typing-cursor');

            setTimeout(async () => {
                bubble.classList.remove('fade-in-up');
                bubble.classList.add('fade-out-up');
                
                setTimeout(() => {
                    state.dialogueIdx++;
                    startStory();
                }, 500);
            }, 1800);
        }

        function showFinalIntro() {
            const finalUI = document.getElementById('final-intro-ui');
            const title = document.getElementById('game-title');
            const startArea = document.getElementById('start-area');

            finalUI.classList.remove('hidden');
            
            setTimeout(() => {
                title.classList.add('opacity-100');
                setTimeout(() => {
                    startArea.classList.add('opacity-100', 'translate-y-0');
                }, 1000);
            }, 500);
        }

        function startGameplay() {
            // Redirect to your actual game HTML file
            window.location.href = 'media.html';
        }
    </script>
</body>
</html>
